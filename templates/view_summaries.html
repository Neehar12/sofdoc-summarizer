<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Summaries - SofDoc AutoPrep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function startProcessing() {
            document.body.style.cursor = 'wait';
        }

        function stopProcessing() {
            document.body.style.cursor = 'default';
        }

        function filterSummaries() {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const summaries = document.querySelectorAll('.summary-row');

            summaries.forEach(summary => {
                const patientName = summary.querySelector('.patient-name').textContent.toLowerCase();
                if (patientName.includes(searchInput)) {
                    summary.style.display = '';
                } else {
                    summary.style.display = 'none';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            function fetchLatestSummaries() {
                startProcessing();
                fetch('/get-latest-summaries')
                    .then(response => response.json())
                    .then(data => {
                        const summariesList = document.getElementById('summaries-list');
                        summariesList.innerHTML = '';
                        data.forEach(summary => {
                            const li = document.createElement('li');
                            const date = new Date(summary.LastModified);
                            li.classList.add('summary-row');
                            li.innerHTML = `
                                <div class="row">
                                    <div class="col patient-name">${summary.Key.split('.')[0]}</div>
                                    <div class="col">${date.toLocaleString()}</div>
                                    <div class="col">
                                        <form method="POST" action="/view-summaries" style="display:inline;">
                                            <input type="hidden" name="file_name" value="${summary.Key}">
                                            <button type="submit" class="view-button" onclick="startProcessing()">View Summary</button>
                                        </form>
                                    </div>
                                </div>
                            `;
                            summariesList.appendChild(li);
                        });
                        stopProcessing();
                    })
                    .catch(() => {
                        stopProcessing();
                    });
            }

            fetchLatestSummaries();
            setInterval(fetchLatestSummaries, 60000); // Update every 1 minute

            document.getElementById('search-input').addEventListener('input', filterSummaries);
        });
    </script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <a href="{{ url_for('home') }}" class="logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="SofDoc Logo" class="logo">
                <h1 class="product-name">SofDoc AutoPrep</h1>
            </a>
        </div>
    </div>
    <div class="sidebar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_patient') }}">Add Patient</a>
        <a href="{{ url_for('view_summaries') }}">View Summaries</a>
    </div>
    <div class="content">
        <h2>View Summaries</h2>
        <input type="text" id="search-input" placeholder="Search patient name" class="search-bar">
        <ul id="summaries-list" class="summaries-list">
            {% for summary in summaries %}
                <li class="summary-row">
                    <div class="row">
                        <div class="col patient-name">{{ summary.Key.split('/')[-1].split('.')[0] }}</div>
                        <div class="col">{{ summary.LastModified }}</div>
                        <div class="col">
                            <form method="POST" action="/view-summaries" style="display:inline;">
                                <input type="hidden" name="file_name" value="{{ summary.Key.split('/')[-1] }}">
                                <button type="submit" class="view-button" onclick="startProcessing()">View Summary</button>
                            </form>
                        </div>
                    </div>
                </li>
            {% endfor %}
        </ul>
        
        {% if selected_summary %}
            <div class="summary-box">
                <h2>Patient Summary</h2>
                <p>{{ selected_summary }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
