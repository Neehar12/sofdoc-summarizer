<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SofDoc AutoPrep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <a href="{{ url_for('home') }}" class="logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="SofDoc Logo" class="logo">
                <h1 class="product-name">SofDoc AutoPrep</h1>
            </a>
            {% if session['user'] %}
                <div class="user-info">
                    <span>{{ session['user']['name'] }}</span>
                    <form action="{{ url_for('logout') }}" method="get" style="display: inline;">
                        <button type="submit" class="button">Logout</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </div>
    <div class="sidebar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_patient') }}">Add Patient</a>
        <a href="{{ url_for('view_summaries') }}">View Summaries</a>
    </div>
    <div class="content">
        <h2>Welcome to SofDoc AutoPrep</h2>
        <p>Your assistant for managing patient summaries efficiently.</p>
    </div>
</body>
</html>
