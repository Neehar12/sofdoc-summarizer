<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient - SofDoc AutoPrep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function showSuccessMessage() {
            const successMessage = document.getElementById('success-message');
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000); // Hide after 5 seconds
        }

        function startProcessing() {
            document.body.style.cursor = 'wait';
        }

        function stopProcessing() {
            document.body.style.cursor = 'default';
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            const form = document.querySelector('form');
            form.addEventListener('submit', (event) => {
                startProcessing();
            });

            if (new URLSearchParams(window.location.search).has('success')) {
                showSuccessMessage();
            }
        });
    </script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <a href="{{ url_for('home') }}" class="logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="SofDoc Logo" class="logo">
                <h1 class="product-name">SofDoc AutoPrep</h1>
            </a>
        </div>
    </div>
    <div class="sidebar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_patient') }}">Add Patient</a>
        <a href="{{ url_for('view_summaries') }}">View Summaries</a>
    </div>
    <div class="content">
        <h2>Add Patient</h2>
        <form method="POST" action="/add-patient">
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
            <input type="date" name="dob" placeholder="Date of Birth" required>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input type="text" name="address" placeholder="Address" required>
            <input type="text" name="patient_id" placeholder="Patient ID" required>
            <button type="submit" onclick="startProcessing()">Add Patient</button>
        </form>
        <div id="success-message" class="success-message">Patient successfully added!</div>
    </div>
</body>
</html>
